al-gradient(700px 500px at 8% 12%, var(--glow-2), transparent 72%);\"><\u002Fdiv>\n  <div style=\"position: fixed; inset: -64px 0 0 0; pointer-events: none; z-index: 0; opacity: 0.5; background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px); background-size: 64px 64px; animation: drift 9s linear infinite; mask-image: linear-gradient(to bottom, black, transparent 85%);\"><\u002Fdiv>\n\n  <header style=\"position: sticky; top: 0; z-index: 20; backdrop-filter: blur(18px); background: var(--header-bg); border-bottom: 1px solid var(--line-soft);\">\n    <nav style=\"max-width: 1240px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; gap: 28px;\">\n      <a href=\"#top\" style=\"display: flex; align-items: center; gap: 10px; color: inherit;\">\n        <span style=\"width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--accent-line); border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: var(--accent); background: var(--accent-tint);\">K<\u002Fspan>\n        <span style=\"font-weight: 600; letter-spacing: -0.01em; font-size: 15px;\">Kush Patel<\u002Fspan>\n      <\u002Fa>\n      <div style=\"flex: 1;\"><\u002Fdiv>\n      <div style=\"display: flex; align-items: center; gap: 26px; font-size: 13.5px; font-weight: 500; color: var(--muted-2);\">\n        <a href=\"#domains\" style=\"color: inherit;\" style-hover=\"color: var(--fg);\">Domains<\u002Fa>\n        <a href=\"#work\" style=\"color: inherit;\" style-hover=\"color: var(--fg);\">Work<\u002Fa>\n        <a href=\"#method\" style=\"color: inherit;\" style-hover=\"color: var(--fg);\">Method<\u002Fa>\n        <a href=\"#experience\" style=\"color: inherit;\" style-hover=\"color: var(--fg);\">Experience<\u002Fa>\n        <a href=\"#education\" style=\"color: inherit;\" style-hover=\"color: var(--fg);\">Education<\u002Fa>\n        <a href=\"#contact\" style=\"color: inherit;\" style-hover=\"color: var(--fg);\">Contact<\u002Fa>\n      <\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ toggleTheme }}\" aria-label=\"Switch colour theme\" style=\"display: inline-flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; padding: 9px 13px; border: 1px solid var(--line-2); border-radius: 999px; background: transparent; color: var(--fg-2); cursor: pointer; white-space: nowrap; transition: border-color 0.2s ease, background 0.2s ease;\" style-hover=\"border-color: var(--accent-line); background: var(--accent-tint);\">\n        <span style=\"width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--accent); background: var(--accent-line-soft);\"><\u002Fspan>\n        {{ themeLabel }}\n      <\u002Fbutton>\n      <a href=\"https://github.com/KushPatel29\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.04em; padding: 9px 14px; border: 1px solid var(--line-2); border-radius: 999px; white-space: nowrap; color: var(--fg-2);\" style-hover=\"border-color: var(--accent-line); background: var(--accent-tint);\">GITHUB ↗<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <main id=\"top\" style=\"position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 0 32px;\">\n\n    <section style=\"display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 56px; align-items: center; padding: 104px 0 72px;\">\n      <div>\n        <div style=\"display: inline-flex; align-items: center; gap: 9px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.14em; color: var(--accent); border: 1px solid var(--accent-line-soft); border-radius: 999px; padding: 7px 13px; background: var(--accent-tint); white-space: nowrap;\">\n          <span style=\"width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 2s ease-in-out infinite;\"><\u002Fspan>\n          BI · ANALYTICS ENGINEERING · DATA ENGINEERING — VANCOUVER, BC\n        <\u002Fdiv>\n        <h1 style=\"margin: 26px 0 0; font-size: clamp(44px, 5.2vw, 78px); line-height: 0.96; letter-spacing: -0.035em; font-weight: 600; text-wrap: pretty;\">\n          Every number on a dashboard should be able to\n          <span style=\"color: var(--accent); font-style: italic; font-weight: 500;\">prove itself.<\u002Fspan>\n        <\u002Fh1>\n        <p style=\"margin: 26px 0 0; max-width: 560px; font-size: 17.5px; line-height: 1.62; color: var(--muted); text-wrap: pretty;\">\n          I'm Kush. For four years I've been the person Finance calls when the P&amp;L doesn't tie, Sales Ops calls when a rep's quota attainment looks wrong, and the warehouse calls when the WMS and the ledger disagree about what's on the shelf. Twelve reporting domains, one pipeline discipline, and one thing I learned early: a dashboard nobody trusts is worse than no dashboard at all — so I started testing numbers the way engineers test code. <strong style=\"color: var(--fg); font-weight: 600;\">No claim without a number, and no number without a test that fails the build if it stops being true.<\u002Fstrong>\n        <\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px;\">\n          <a href=\"#work\" style=\"display: inline-flex; align-items: center; gap: 9px; padding: 14px 22px; border-radius: 10px; white-space: nowrap; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 14.5px;\" style-hover=\"background: var(--accent-hi);\">See the work ↓<\u002Fa>\n          <a href=\"https://www.linkedin.com/in/kush-patel-48885719b/\" style=\"display: inline-flex; align-items: center; gap: 9px; padding: 14px 22px; border-radius: 10px; white-space: nowrap; border: 1px solid var(--line-3); color: var(--fg); font-weight: 500; font-size: 14.5px;\" style-hover=\"border-color: var(--accent-line);\">LinkedIn ↗<\u002Fa>\n          <a href=\"mailto:dharma.patel552@gmail.com\" style=\"display: inline-flex; align-items: center; gap: 9px; padding: 14px 22px; border-radius: 10px; white-space: nowrap; border: 1px solid var(--line-3); color: var(--fg); font-weight: 500; font-size: 14.5px;\" style-hover=\"border-color: var(--accent-line);\">Email me<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ showTerminalDemo }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position: relative; border: 1px solid var(--term-line); border-radius: 16px; background: var(--term-bg); box-shadow: 0 40px 80px -30px var(--shadow), inset 0 1px 0 var(--accent-tint); overflow: hidden;\">\n        <div style=\"position: absolute; left: 0; right: 0; top: 0; height: 90px; background: linear-gradient(var(--term-accent-tint), transparent); animation: sweep 6s linear infinite; pointer-events: none;\"><\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--term-line);\">\n          <span style=\"width: 9px; height: 9px; border-radius: 50%; background: oklch(0.68 0.16 25);\"><\u002Fspan>\n          <span style=\"width: 9px; height: 9px; border-radius: 50%; background: oklch(0.79 0.14 80);\"><\u002Fspan>\n          <span style=\"width: 9px; height: 9px; border-radius: 50%; background: oklch(0.74 0.15 150);\"><\u002Fspan>\n          <span style=\"margin-left: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--term-dim); letter-spacing: 0.06em;\">ask-your-data · app/cli.py<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 22px 20px 26px; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.75;\">\n          <div style=\"color: var(--term-accent);\">&gt; how many migration artifacts passed parallel-run validation?<\u002Fdiv>\n          <div style=\"color: var(--term-fg); margin-top: 12px;\">107 artifacts have a GO verdict.<\u002Fdiv>\n          <div style=\"margin-top: 12px; padding: 12px 14px; border-left: 2px solid var(--term-amber-line); background: var(--term-amber-tint); color: var(--term-amber); white-space: pre-wrap;\">SELECT COUNT(*) FROM migration_parallel_run_results\nWHERE verdict = 'GO'<\u002Fdiv>\n          <div style=\"color: var(--term-accent); margin-top: 18px;\">&gt; delete all denied claims<\u002Fdiv>\n          <div style=\"color: var(--term-red); margin-top: 10px;\">I can't do that — this is a read-only interface.<span style=\"display: inline-block; width: 8px; height: 15px; margin-left: 6px; vertical-align: -2px; background: var(--term-accent); animation: blink 1.1s steps(1) infinite;\"><\u002Fspan><\u002Fdiv>\n          <div style=\"margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--term-line); font-size: 11.5px; color: var(--term-dim); font-family: 'Space Grotesk', sans-serif; line-height: 1.5;\">Not a screenshot — the question, the SQL and the answer are all pinned by golden-question tests in CI.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <section style=\"display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);\">\n      <sc-for list=\"{{ metrics }}\" as=\"m\" hint-placeholder-count=\"4\">\n        <div style=\"padding: 30px 26px; border-right: 1px solid var(--line-soft);\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 38px; font-weight: 500; letter-spacing: -0.03em; color: var(--fg);\">{{ m.value }}<\u002Fdiv>\n          <div style=\"margin-top: 8px; font-size: 12.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim);\">{{ m.label }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n\n    <section id=\"domains\" style=\"padding: 96px 0 0;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.16em; color: var(--accent);\">01 — WHAT I ACTUALLY GET ASKED<\u002Fdiv>\n      <h2 style=\"margin: 18px 0 0; max-width: 900px; font-size: clamp(30px, 3.4vw, 46px); line-height: 1.08; letter-spacing: -0.03em; font-weight: 600; text-wrap: pretty;\">I'm not a finance analyst who wandered into ops. I've owned the whole reporting surface.<\u002Fh2>\n      <p style=\"margin: 18px 0 0; max-width: 690px; font-size: 16.5px; line-height: 1.6; color: var(--muted-2);\">Twelve domains, one grain of truth underneath them. Each of these is a question I've been handed in a real meeting — and the model I built so nobody had to ask twice.<\u002Fp>\n\n      <div style=\"margin-top: 44px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;\">\n        <sc-for list=\"{{ domains }}\" as=\"d\" hint-placeholder-count=\"10\">\n          <div style=\"padding: 26px 26px 28px; background: var(--tile);\" style-hover=\"background: var(--tile-hover);\">\n            <div style=\"display: flex; align-items: baseline; gap: 10px;\">\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--dim-2);\">{{ d.n }}<\u002Fspan>\n              <h3 style=\"margin: 0; font-size: 17.5px; font-weight: 600; letter-spacing: -0.015em;\">{{ d.name }}<\u002Fh3>\n            <\u002Fdiv>\n            <div style=\"margin: 12px 0 0; font-size: 14px; line-height: 1.5; color: var(--amber-2); font-style: italic;\">“{{ d.ask }}”<\u002Fdiv>\n            <p style=\"margin: 10px 0 0; font-size: 14px; line-height: 1.58; color: var(--muted-2);\">{{ d.answer }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"work\" style=\"padding: 96px 0 0;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.16em; color: var(--accent);\">02 — THE WORK<\u002Fdiv>\n      <h2 style=\"margin: 18px 0 0; max-width: 900px; font-size: clamp(30px, 3.4vw, 46px); line-height: 1.08; letter-spacing: -0.03em; font-weight: 600; text-wrap: pretty;\">Eight projects. Every one started with a question somebody actually asked me at work.<\u002Fh2>\n      <p style=\"margin: 18px 0 0; max-width: 660px; font-size: 16.5px; line-height: 1.6; color: var(--muted-2);\">Each repo rebuilds itself from seeded synthetic data on every push — no PHI, no real customers, no real employees. If a sentence in a README stops being true, the build goes red and I find out before you do. A green badge means it <em>runs today<\u002Fem>, not that it worked once on my laptop.<\u002Fp>\n\n      <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 34px; padding-bottom: 20px; border-bottom: 1px solid var(--line);\">\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; color: var(--dim); white-space: nowrap; margin-right: 4px;\">FILTER<\u002Fspan>\n        <sc-for list=\"{{ filters }}\" as=\"ff\" hint-placeholder-count=\"6\">\n          <button type=\"button\" sc-camel-on-click=\"{{ ff.onClick }}\" style=\"{{ ff.style }}\">{{ ff.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n        <span style=\"flex: 1 1 20px;\"><\u002Fspan>\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; color: var(--dim); white-space: nowrap;\">{{ shownCount }}<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"margin-top: 28px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 24px; align-items: stretch;\">\n        <div style=\"position: relative; padding: 34px; border: 1px solid var(--accent-line-soft); border-radius: 18px; background: linear-gradient(150deg, var(--accent-wash), var(--panel)); overflow: hidden;\">\n          <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: var(--amber);\">CAPSTONE · LLM ENGINEERING<\u002Fdiv>\n          <h3 style=\"margin: 14px 0 0; font-size: 32px; letter-spacing: -0.025em; font-weight: 600;\">Ask Your Data<\u002Fh3>\n          <p style=\"margin: 16px 0 0; font-size: 15.5px; line-height: 1.62; color: var(--muted); max-width: 520px;\">This repo began life as a Raspberry Pi voice assistant. I left the pivot in the git history on purpose, because the interesting version is this one: ask a question in plain English across all 36 tables of my portfolio — six business domains — and get an answer you can audit. The model never answers from memory. It writes SQL, the SQL runs behind a read-only guard, and the query sits right next to the answer so you can disagree with it. Ask it to delete something and it refuses. Its self-correction loop is bounded and <em>proven in CI with a scripted fake model<\u002Fem>, so the tests pass without ever calling a paid API.<\u002Fp>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px;\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 6px 10px; border-radius: 6px; white-space: nowrap; border: 1px solid var(--line-2); color: var(--muted);\">Python<\u002Fspan>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 6px 10px; border-radius: 6px; white-space: nowrap; border: 1px solid var(--line-2); color: var(--muted);\">DuckDB<\u002Fspan>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 6px 10px; border-radius: 6px; white-space: nowrap; border: 1px solid var(--line-2); color: var(--muted);\">Claude API<\u002Fspan>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 6px 10px; border-radius: 6px; white-space: nowrap; border: 1px solid var(--line-2); color: var(--muted);\">Streamlit<\u002Fspan>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 6px 10px; border-radius: 6px; white-space: nowrap; border: 1px solid var(--ok-line); background: var(--ok-tint); color: var(--ok);\">64 tests ✓<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 30px; margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--line);\">\n            <div>\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; color: var(--accent);\">36<\u002Fdiv>\n              <div style=\"margin-top: 4px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: var(--dim); white-space: nowrap;\">TABLES QUERIED<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; color: var(--accent);\">6<\u002Fdiv>\n              <div style=\"margin-top: 4px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: var(--dim); white-space: nowrap;\">BUSINESS DOMAINS<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; color: var(--accent);\">0<\u002Fdiv>\n              <div style=\"margin-top: 4px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; color: var(--dim); white-space: nowrap;\">ANSWERS FROM MEMORY<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <a href=\"https://github.com/KushPatel29/IVA\" style=\"display: inline-flex; align-items: center; gap: 8px; margin-top: 26px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; letter-spacing: 0.04em; padding: 11px 16px; border-radius: 8px; white-space: nowrap; background: var(--accent); color: var(--on-accent); font-weight: 700;\" style-hover=\"background: var(--accent-hi);\">READ THE STORY ↗<\u002Fa>\n        <\u002Fdiv>\n\n        <a href=\"https://github.com/KushPatel29/supply-chain-control-tower-\" style=\"display: block; color: inherit; border: 1px solid var(--line-2); border-radius: 18px; background: var(--panel); overflow: hidden;\" style-hover=\"border-color: var(--accent-line);\">\n          <img src=\"7098f56e-2425-4a73-897c-ebbfb4cb743d\" alt=\"Supply Chain Control Tower — executive overview dashboard in Power BI\" style=\"display: block; width: 100%; height: 250px; object-fit: cover; object-position: top left; border-bottom: 1px solid var(--line);\">\n          <div style=\"padding: 26px 28px 30px;\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: var(--amber);\">DATA PLATFORM · FABRIC PATTERNS<\u002Fdiv>\n            <h3 style=\"margin: 12px 0 0; font-size: 25px; letter-spacing: -0.02em; font-weight: 600;\">Supply Chain Control Tower<\u002Fh3>\n            <p style=\"margin: 12px 0 0; font-size: 14.5px; line-height: 1.6; color: var(--muted);\">Bad data doesn't announce itself; it quietly changes a number an executive already screenshotted. So this pipeline defends in three layers — schema contracts stop drift before Bronze, poisoned rows quarantine with replay, a quality gate guards Gold — and CI proves each layer by <em>injecting the exact failure it exists to catch<\u002Fem>. Benchmarked at 10M rows in Delta, with row- and column-level security verified by impersonated DAX.<\u002Fp>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px;\">\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 6px 10px; border-radius: 6px; white-space: nowrap; border: 1px solid var(--line-2); color: var(--muted);\">PySpark<\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 6px 10px; border-radius: 6px; white-space: nowrap; border: 1px solid var(--line-2); color: var(--muted);\">Delta Lake<\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 6px 10px; border-radius: 6px; white-space: nowrap; border: 1px solid var(--line-2); color: var(--muted);\">Power BI<\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 6px 10px; border-radius: 6px; white-space: nowrap; border: 1px solid var(--ok-line); background: var(--ok-tint); color: var(--ok);\">49 tests ✓<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: 14px 1fr; gap: 10px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line-soft); font-size: 13px; line-height: 1.5; color: var(--muted-2);\">\n              <span style=\"color: var(--ok); font-family: 'JetBrains Mono', monospace; font-size: 12px;\">✓<\u002Fspan>\n              <span>10M-row Delta benchmark · 3 defence tiers, each proven by an injected failure · 4-page control tower<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fa>\n      <\u002Fdiv>\n\n      <div style=\"margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 24px;\">\n        <sc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <a href=\"{{ p.url }}\" style=\"position: relative; display: flex; flex-direction: column; color: inherit; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); overflow: hidden; transition: transform 0.28s cubic-bezier(0.2,0.8,0.2,1), border-color 0.28s ease, background 0.28s ease, box-shadow 0.28s ease;\" style-hover=\"border-color: var(--accent-line); background: var(--tile-hover); transform: translateY(-5px); box-shadow: 0 28px 55px -28px var(--shadow);\">\n            <div role=\"img\" aria-label=\"{{ p.alt }}\" style=\"{{ p.imgStyle }}\"><\u002Fdiv>\n            <div style=\"padding: 22px 24px 24px; display: flex; flex-direction: column; flex: 1;\">\n              <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px;\">\n                <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; color: var(--amber);\">{{ p.kicker }}<\u002Fdiv>\n                <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: var(--ok); white-space: nowrap;\">{{ p.tests }} ✓<\u002Fdiv>\n              <\u002Fdiv>\n              <h3 style=\"margin: 11px 0 0; font-size: 20px; letter-spacing: -0.018em; font-weight: 600;\">{{ p.title }}<\u002Fh3>\n              <p style=\"margin: 11px 0 0; font-size: 14px; line-height: 1.58; color: var(--muted-2); flex: 1;\">{{ p.body }}<\u002Fp>\n\n              <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; padding: 16px 0; border-top: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft);\">\n                <sc-for list=\"{{ p.stats }}\" as=\"st\" hint-placeholder-count=\"3\">\n                  <div>\n                    <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 500; letter-spacing: -0.02em; color: var(--accent);\">{{ st.v }}<\u002Fdiv>\n                    <div style=\"margin-top: 3px; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em; color: var(--dim); line-height: 1.4;\">{{ st.k }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"display: grid; grid-template-columns: 14px 1fr; gap: 9px; margin-top: 16px; font-size: 13px; line-height: 1.5; color: var(--muted-2);\">\n                <span style=\"color: var(--ok); font-family: 'JetBrains Mono', monospace; font-size: 12px;\">✓<\u002Fspan>\n                <span>{{ p.proof }}<\u002Fspan>\n              <\u002Fdiv>\n\n              <div style=\"display: flex; flex-wrap: wrap; gap: 7px; margin-top: 18px;\">\n                <sc-for list=\"{{ p.stack }}\" as=\"s\" hint-placeholder-count=\"3\">\n                  <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; padding: 5px 9px; border-radius: 6px; white-space: nowrap; border: 1px solid var(--line-2); color: var(--muted);\">{{ s }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line-soft); font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: var(--accent);\">\n                <span>OPEN REPO<\u002Fspan>\n                <span>↗<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <a href=\"https://github.com/KushPatel29\" style=\"display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-top: 24px; padding: 26px 30px; border: 1px dashed var(--line-3); border-radius: 16px; color: inherit;\" style-hover=\"border-color: var(--accent-line); background: var(--accent-tint);\">\n        <div>\n          <h3 style=\"margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.018em;\">…and the profile that ties it together<\u002Fh3>\n          <p style=\"margin: 8px 0 0; font-size: 14.5px; color: var(--muted-2);\">Where to start, what each project is actually proving, and the losses I keep on purpose.<\u002Fp>\n        <\u002Fdiv>\n        <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--accent); white-space: nowrap;\">github.com/KushPatel29 ↗<\u002Fspan>\n      <\u002Fa>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ showLossSection }}\" hint-placeholder-val=\"{{ true }}\">\n    <section id=\"method\" style=\"padding: 104px 0 0;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.16em; color: var(--accent);\">03 — THE METHOD<\u002Fdiv>\n      <h2 style=\"margin: 18px 0 0; font-size: clamp(30px, 3.4vw, 46px); line-height: 1.08; letter-spacing: -0.03em; font-weight: 600;\">My favourite results are the ones where I lost.<\u002Fh2>\n      <p style=\"margin: 18px 0 0; max-width: 680px; font-size: 16.5px; line-height: 1.6; color: var(--muted-2);\">Anyone can show you the model that won. I'd rather show you the one I killed and the boring baseline that beat it, because choosing what <em>not<\u002Fem> to ship is most of this job.<\u002Fp>\n\n      <div style=\"margin-top: 44px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px;\">\n        <sc-for list=\"{{ losses }}\" as=\"l\" hint-placeholder-count=\"3\">\n          <div style=\"padding: 30px 28px 32px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel);\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; color: var(--amber);\">{{ l.stat }}<\u002Fdiv>\n            <h3 style=\"margin: 16px 0 0; font-size: 19px; font-weight: 600; letter-spacing: -0.015em;\">{{ l.title }}<\u002Fh3>\n            <p style=\"margin: 11px 0 0; font-size: 14.5px; line-height: 1.6; color: var(--muted-2);\">{{ l.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top: 52px; padding: 34px 32px 36px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel);\">\n        <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: var(--amber);\">HOW A NUMBER GETS ONTO A DASHBOARD<\u002Fdiv>\n        <div style=\"margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 20px;\">\n          <sc-for list=\"{{ pipeline }}\" as=\"s\" hint-placeholder-count=\"5\">\n            <div style=\"position: relative; padding-top: 18px; border-top: 2px solid var(--accent-line-soft);\">\n              <div style=\"position: absolute; top: -5px; left: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--accent);\"><\u002Fdiv>\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; color: var(--dim);\">{{ s.step }}<\u002Fdiv>\n              <h4 style=\"margin: 9px 0 0; font-size: 16px; font-weight: 600; letter-spacing: -0.015em;\">{{ s.title }}<\u002Fh4>\n              <p style=\"margin: 8px 0 0; font-size: 13.5px; line-height: 1.55; color: var(--muted-2);\">{{ s.body }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px;\">\n        <sc-for list=\"{{ principles }}\" as=\"pr\" hint-placeholder-count=\"3\">\n          <div style=\"padding: 24px 24px 26px; border-left: 2px solid var(--amber-line); background: var(--panel-soft);\">\n            <h4 style=\"margin: 0; font-size: 16.5px; font-weight: 600; letter-spacing: -0.015em;\">{{ pr.title }}<\u002Fh4>\n            <p style=\"margin: 9px 0 0; font-size: 14px; line-height: 1.58; color: var(--muted-2);\">{{ pr.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <p style=\"margin: 32px 0 0; max-width: 780px; font-size: 16px; line-height: 1.65; color: var(--muted-2);\">Every repo has a short section on what I <em style=\"color: var(--fg);\">deliberately didn't build<\u002Fem>: no vector database where a SQL join was the right answer, no deep learning on 38 SKUs, no cloud architecture I couldn't defend in a budget meeting. Restraint is harder to demo than complexity, so I write it down.<\u002Fp>\n    <\u002Fsection>\n    <\u002Fsc-if>\n\n    <section id=\"experience\" style=\"padding: 104px 0 0;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.16em; color: var(--accent);\">04 — WHERE THE HABITS CAME FROM<\u002Fdiv>\n      <h2 style=\"margin: 18px 0 0; max-width: 860px; font-size: clamp(30px, 3.4vw, 46px); line-height: 1.08; letter-spacing: -0.03em; font-weight: 600; text-wrap: pretty;\">The repos are the clean version. These were the messy originals.<\u002Fh2>\n\n      <p style=\"margin: 18px 0 0; max-width: 690px; font-size: 16.5px; line-height: 1.6; color: var(--muted-2);\">Every technique in the repos above was learned somewhere with a deadline attached.<\u002Fp>\n\n      <div style=\"margin-top: 46px; display: grid; gap: 0; border-top: 1px solid var(--line);\">\n        <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"2\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 44px; padding: 40px 0 44px; border-bottom: 1px solid var(--line);\">\n            <div style=\"flex: 1 1 300px; max-width: 340px; min-width: 0;\">\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: var(--amber);\">{{ r.period }}<\u002Fdiv>\n              <h3 style=\"margin: 12px 0 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em;\">{{ r.org }}<\u002Fh3>\n              <div style=\"margin-top: 7px; font-size: 14.5px; line-height: 1.5; color: var(--fg-2);\">{{ r.title }}<\u002Fdiv>\n              <div style=\"margin-top: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.05em; color: var(--dim); line-height: 1.6;\">{{ r.scope }}<\u002Fdiv>\n              <p style=\"margin: 16px 0 0; font-size: 14.5px; line-height: 1.6; color: var(--muted-2);\">{{ r.summary }}<\u002Fp>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 7px; margin-top: 18px;\">\n                <sc-for list=\"{{ r.stack }}\" as=\"s\" hint-placeholder-count=\"6\">\n                  <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; padding: 5px 9px; border-radius: 6px; white-space: nowrap; border: 1px solid var(--line-2); color: var(--muted);\">{{ s }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex: 3 1 440px; min-width: 0; display: grid; gap: 26px;\">\n              <sc-for list=\"{{ r.groups }}\" as=\"g\" hint-placeholder-count=\"4\">\n                <div>\n                  <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 13px;\">\n                    <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; color: var(--accent); white-space: nowrap;\">{{ g.label }}<\u002Fspan>\n                    <span style=\"flex: 1; height: 1px; background: var(--line);\"><\u002Fspan>\n                  <\u002Fdiv>\n                  <ul style=\"margin: 0; padding: 0; list-style: none; display: grid; gap: 11px;\">\n                    <sc-for list=\"{{ g.points }}\" as=\"pt\" hint-placeholder-count=\"2\">\n                      <li style=\"display: grid; grid-template-columns: 15px 1fr; gap: 11px; font-size: 15px; line-height: 1.6; color: var(--muted);\">\n                        <span style=\"color: var(--accent-dim); font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.95;\">▸<\u002Fspan>\n                        <span>{{ pt }}<\u002Fspan>\n                      <\u002Fli>\n                    <\u002Fsc-for>\n                  <\u002Ful>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"education\" style=\"padding: 104px 0 0;\">\n      <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.16em; color: var(--accent);\">05 — EDUCATION &amp; CREDENTIALS<\u002Fdiv>\n      <h2 style=\"margin: 18px 0 0; max-width: 880px; font-size: clamp(30px, 3.4vw, 46px); line-height: 1.08; letter-spacing: -0.03em; font-weight: 600; text-wrap: pretty;\">Formally trained in machine intelligence. Certified on the platform I ship on.<\u002Fh2>\n\n      <div style=\"margin-top: 44px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 22px;\">\n        <div style=\"position: relative; overflow: hidden; padding: 32px 30px 34px; border: 1px solid var(--accent-line-soft); border-radius: 18px; background: linear-gradient(155deg, var(--accent-wash), var(--panel));\">\n          <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 16px;\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; color: var(--amber); white-space: nowrap;\">MASTER'S DEGREE<\u002Fdiv>\n            <div style=\"display: flex; align-items: baseline; gap: 7px; white-space: nowrap;\">\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: var(--accent-dim);\">GPA<\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 500; letter-spacing: -0.02em; color: var(--accent-hi);\">3.76<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <h3 style=\"margin: 16px 0 0; font-size: 23px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2;\">MPS, Analytics — Applied Machine Intelligence<\u002Fh3>\n          <div style=\"margin-top: 8px; font-size: 15px; color: var(--fg-2);\">Northeastern University · Vancouver, BC<\u002Fdiv>\n          <p style=\"margin: 16px 0 0; font-size: 14.5px; line-height: 1.6; color: var(--muted);\">The degree is where the AI/ML half of this portfolio comes from — and where I learned to distrust a model that hasn't been tested against a boring baseline. Capstone: the grounded text-to-SQL assistant above.<\u002Fp>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 7px; margin-top: 20px;\">\n            <sc-for list=\"{{ coursework }}\" as=\"c\" hint-placeholder-count=\"6\">\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; padding: 5px 9px; border-radius: 6px; white-space: nowrap; border: 1px solid var(--line-2); color: var(--muted);\">{{ c }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; gap: 22px;\">\n          <div style=\"padding: 26px 28px 28px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel);\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; color: var(--dim);\">BACHELOR'S<\u002Fdiv>\n            <h3 style=\"margin: 12px 0 0; font-size: 20px; font-weight: 600; letter-spacing: -0.018em;\">B.Eng., Computer Science<\u002Fh3>\n            <div style=\"margin-top: 7px; font-size: 14.5px; color: var(--muted);\">Gujarat Technological University<\u002Fdiv>\n            <p style=\"margin: 12px 0 0; font-size: 14px; line-height: 1.58; color: var(--muted-2);\">Engineering fundamentals — which is why the analytics work ends up in a repo with tests instead of a workbook on a shared drive.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"padding: 26px 28px 28px; border: 1px solid var(--amber-line-soft); border-radius: 18px; background: var(--amber-tint);\">\n            <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; color: var(--amber);\">AWARD<\u002Fdiv>\n            <h3 style=\"margin: 12px 0 0; font-size: 20px; font-weight: 600; letter-spacing: -0.018em;\">First prize — wildfire-prediction hackathon<\u002Fh3>\n            <p style=\"margin: 12px 0 0; font-size: 14px; line-height: 1.58; color: var(--muted-2);\">Python + Azure against live sensor feeds, under a clock. Won on a model that was defensible, not the one with the most moving parts.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top: 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px;\">\n        <sc-for list=\"{{ certs }}\" as=\"ct\" hint-placeholder-count=\"2\">\n          <div style=\"display: flex; align-items: flex-start; gap: 16px; padding: 24px 26px 26px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel);\">\n            <span style=\"margin-top: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: 0 0 auto;\"><\u002Fspan>\n            <div>\n              <h4 style=\"margin: 0; font-size: 16.5px; font-weight: 600; letter-spacing: -0.015em;\">{{ ct.name }}<\u002Fh4>\n              <div style=\"margin-top: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: var(--dim);\">{{ ct.code }} · {{ ct.status }}<\u002Fdiv>\n              <p style=\"margin: 9px 0 0; font-size: 13.5px; line-height: 1.55; color: var(--muted-2);\">{{ ct.body }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"contact\" style=\"padding: 104px 0 110px;\">\n      <div style=\"position: relative; overflow: hidden; padding: 64px 56px; border: 1px solid var(--accent-line-soft); border-radius: 22px; background: linear-gradient(140deg, var(--accent-wash), var(--panel));\">\n        <div style=\"position: absolute; inset: 0; pointer-events: none; opacity: 0.35; background-image: linear-gradient(90deg, var(--accent-tint) 1px, transparent 1px); background-size: 40px 100%;\"><\u002Fdiv>\n        <div style=\"position: relative;\">\n          <h2 style=\"margin: 0; max-width: 780px; font-size: clamp(30px, 3.6vw, 48px); line-height: 1.06; letter-spacing: -0.032em; font-weight: 600; text-wrap: pretty;\">If your reporting layer has a trust problem, that's my favourite kind of work.<\u002Fh2>\n          <p style=\"margin: 18px 0 0; font-size: 17px; color: var(--muted);\">I'm looking for a BI Analyst or Analytics Engineer role — Vancouver or remote. Tell me which number your leadership team argues about most and I'll tell you how I'd go about ending the argument.<\u002Fp>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px;\">\n            <a href=\"mailto:dharma.patel552@gmail.com\" style=\"padding: 15px 24px; border-radius: 10px; white-space: nowrap; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 15px; font-family: 'JetBrains Mono', monospace;\" style-hover=\"background: var(--accent-hi);\">dharma.patel552@gmail.com<\u002Fa>\n            <a href=\"https://www.linkedin.com/in/kush-patel-48885719b/\" style=\"padding: 15px 24px; border-radius: 10px; white-space: nowrap; border: 1px solid var(--line-3); color: var(--fg); font-weight: 500; font-size: 15px;\" style-hover=\"border-color: var(--accent-line);\">LinkedIn ↗<\u002Fa>\n            <a href=\"https://github.com/KushPatel29\" style=\"padding: 15px 24px; border-radius: 10px; white-space: nowrap; border: 1px solid var(--line-3); color: var(--fg); font-weight: 500; font-size: 15px;\" style-hover=\"border-color: var(--accent-line);\">GitHub ↗<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-top: 40px; padding-top: 28px; border-top: 1px solid var(--line); font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: 0.08em; color: var(--dim);\">\n            <span>MPS ANALYTICS (APPLIED ML), NORTHEASTERN — GPA 3.76<\u002Fspan>\n            <span style=\"color: var(--dim-2);\">/<\u002Fspan>\n            <span>MICROSOFT CERTIFIED: FABRIC ANALYTICS ENGINEER (DP-600) — IN PROGRESS<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fmain>\n\n  <footer style=\"position: relative; z-index: 1; border-top: 1px solid var(--line-soft);\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 26px 32px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--dim); letter-spacing: 0.04em;\">\n      <span>© KUSH PATEL · HAND-BUILT — NO FRAMEWORK, NO TRACKER.<\u002Fspan>\n      <a href=\"https://github.com/KushPatel29/KushPatel29.github.io\" style=\"color: var(--accent-dim);\">VIEW SOURCE ↗<\u002Fa>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;showTerminalDemo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;showLossSection&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;}}\">\nclass Component extends DCLogic {\n  state = { t: 0, theme: null, filter: \"all\", pct: 0 };\n\n  componentDidMount() {\n    let saved = null;\n    try { saved = localStorage.getItem(\"kp-theme\"); } catch (e) {}\n    const theme = saved || this.props.defaultTheme || \"dark\";\n    this.applyTheme(theme);\n    this.setState({ theme: theme });\n\n    this._onScroll = () => {\n      if (this._pending) return;\n      this._pending = true;\n      requestAnimationFrame(() => {\n        this._pending = false;\n        const d = document.documentElement;\n        const max = d.scrollHeight - d.clientHeight;\n        this.setState({ pct: max > 0 ? Math.min(100, (d.scrollTop / max) * 100) : 0 });\n      });\n    };\n    window.addEventListener(\"scroll\", this._onScroll, { passive: true });\n\n    const start = performance.now();\n    const tick = () => {\n      const p = Math.min(1, (performance.now() - start) / 1400);\n      this.setState({ t: 1 - Math.pow(1 - p, 3) });\n      if (p < 1) this._raf = requestAnimationFrame(tick);\n    };\n    this._raf = requestAnimationFrame(tick);\n  }\n  componentWillUnmount() {\n    cancelAnimationFrame(this._raf);\n    window.removeEventListener(\"scroll\", this._onScroll);\n  }\n\n  applyTheme(theme) {\n    document.documentElement.setAttribute(\"data-theme\", theme);\n  }\n\n  toggleTheme = () => {\n    const next = (this.state.theme === \"light\") ? \"dark\" : \"light\";\n    this.applyTheme(next);\n    try { localStorage.setItem(\"kp-theme\", next); } catch (e) {}\n    this.setState({ theme: next });\n  };\n\n  chipStyle(active) {\n    return {\n      fontFamily: \"'JetBrains Mono', monospace\",\n      fontSize: \"10.5px\",\n      letterSpacing: \"0.08em\",\n      padding: \"8px 13px\",\n      borderRadius: \"999px\",\n      whiteSpace: \"nowrap\",\n      cursor: \"pointer\",\n      transition: \"background 0.2s ease, border-color 0.2s ease, color 0.2s ease\",\n      border: active ? \"1px solid var(--accent-line)\" : \"1px solid var(--line-2)\",\n      background: active ? \"var(--accent-tint)\" : \"transparent\",\n      color: active ? \"var(--accent)\" : \"var(--muted)\"\n    };\n  }\n\n  renderVals() {\n    const t = this.state.t;\n    const n = (v, suffix) => Math.round(v * t) + (suffix || \"\");\n    const filter = this.state.filter;\n    const shown = this.allProjects().filter(p => filter === \"all\" || p.tags.indexOf(filter) > -1);\n    return {\n      themeLabel: this.state.theme === \"light\" ? \"LIGHT\" : \"DARK\",\n      toggleTheme: this.toggleTheme,\n      progressStyle: {\n        position: \"fixed\", top: 0, left: 0, height: \"2px\", zIndex: 40,\n        background: \"var(--accent)\", width: this.state.pct + \"%\",\n        pointerEvents: \"none\", transition: \"width 0.12s linear\"\n      },\n      filters: [\n        { key: \"all\", label: \"ALL WORK\" },\n        { key: \"finance\", label: \"FINANCE & CONTROLS\" },\n        { key: \"supply\", label: \"SUPPLY CHAIN & PLATFORM\" },\n        { key: \"customer\", label: \"CUSTOMER & SALES\" },\n        { key: \"ai\", label: \"AI & ML\" }\n      ].map(x => ({\n        label: x.label,\n        style: this.chipStyle(filter === x.key),\n        onClick: () => this.setState({ filter: x.key })\n      })),\n      shownCount: \"SHOWING \" + shown.length + \" / \" + this.allProjects().length + \" REPOS\",\n      projects: shown,\n      showTerminalDemo: this.props.showTerminalDemo ?? true,\n      showLossSection: this.props.showLossSection ?? true,\n      metrics: [\n        { value: n(8), label: \"public repos\" },\n        { value: n(308), label: \"CI-verified tests\" },\n        { value: n(12), label: \"domains I report on\" },\n        { value: n(4, \"+\"), label: \"years in BI & analytics\" }\n      ],\n      losses: this.lossData(),\n      domains: this.domainData(),\n      roles: this.roleData(),\n      coursework: this.coursework(),\n      certs: this.certs(),\n      pipeline: this.pipelineSteps(),\n      principles: this.principles()\n    };\n  }\n\n  allProjects() {\n    return [\n        {\n          url: \"https://github.com/KushPatel29/healthcare-claims-analytics\",\n          tags: [\"finance\", \"ai\"],\n          stats: [{ v: \"$3.6M\", k: \"OPEN AR PRICED\" }, { v: \"~$1.7M\", k: \"EXPECTED CASH\" }, { v: \"19\", k: \"CI TESTS\" }],\n          proof: \"Paid ≤ allowed ≤ submitted, NRV ceilings and AR control totals reconciled to the penny on every push.\",\n          img: \"https://kushpatel29.github.io/assets/healthcare-nrv.jpg\",\n          imgStyle: { display: \"block\", width: \"100%\", height: \"168px\", backgroundImage: \"url(https://kushpatel29.github.io/assets/healthcare-nrv.jpg)\", backgroundSize: \"cover\", backgroundPosition: \"top left\", borderBottom: \"1px solid var(--line-soft)\" },\n          alt: \"Healthcare revenue-cycle dashboard — predictive yield and Net Realizable Value page\",\n          kicker: \"PREDICTIVE · REVENUE CYCLE\",\n          title: \"Healthcare Claims — NRV\",\n          body: \"Reporting tells you $3.6M is outstanding. Finance wants to know what will actually land in the bank. This one prices open AR at the ~$1.7M it's realistically worth and hands the follow-up team a ranked worklist instead of a spreadsheet. CI enforces paid ≤ allowed ≤ submitted and ties AR control totals to the penny.\",\n          stack: [\"Python\", \"Power BI\", \"DAX\"], tests: \"19 tests\"\n        },\n        {\n          url: \"https://github.com/KushPatel29/Customer-Recommendation-Engine\",\n          img: \"https://kushpatel29.github.io/assets/customer-rec.jpg\",\n          imgStyle: { display: \"block\", width: \"100%\", height: \"168px\", backgroundImage: \"url(https://kushpatel29.github.io/assets/customer-rec.jpg)\", backgroundSize: \"cover\", backgroundPosition: \"top left\", borderBottom: \"1px solid var(--line-soft)\" },\n          alt: \"Customer analytics dashboard — sales overview page\",\n          kicker: \"ML SERVING · A/B\",\n          title: \"Customer Recommendation Engine\",\n          body: \"I built the impressive thing first: two-stage retrieval with a gradient-boosted ranker, 80.0% hit-rate@10. Plain collaborative filtering got 84.9%. So the simple one ships, the fancy one stays in the repo as evidence, and a CI test fails if the winner ever stops winning. Served with FastAPI + Docker, read in a 7-page Power BI app.\",\n          tags: [\"customer\", \"ai\"],\n          stats: [{ v: \"84.9%\", k: \"HIT-RATE@10 SHIPPED\" }, { v: \"80.0%\", k: \"RANKER THAT LOST\" }, { v: \"38\", k: \"CI TESTS\" }],\n          proof: \"A CI test fails the build if the shipped baseline ever stops beating the challenger.\",\n          stack: [\"scikit-learn\", \"FastAPI\", \"MLflow\"], tests: \"38 tests\"\n        },\n        {\n          url: \"https://github.com/KushPatel29/hr-attrition-analytics\",\n          img: \"https://kushpatel29.github.io/assets/hr-attrition.jpg\",\n          imgStyle: { display: \"block\", width: \"100%\", height: \"168px\", backgroundImage: \"url(https://kushpatel29.github.io/assets/hr-attrition.jpg)\", backgroundSize: \"cover\", backgroundPosition: \"top left\", borderBottom: \"1px solid var(--line-soft)\" },\n          alt: \"HR workforce scorecard dashboard\",\n          kicker: \"PEOPLE ANALYTICS · GOVERNANCE\",\n          title: \"HR Attrition Analytics\",\n          body: \"People data raises the stakes, so the guardrails came before the model: k-anonymity masking, a disparate-impact gate in CI (four-fifths rule plus Fisher's exact), survival analysis that's honest about censoring. The flight-risk model uses zero protected attributes — and turned out to score better without them.\",\n          tags: [\"ai\"],\n          stats: [{ v: \"0\", k: \"PROTECTED ATTRS USED\" }, { v: \"4/5\", k: \"RULE GATE IN CI\" }, { v: \"52\", k: \"CI TESTS\" }],\n          proof: \"k-anonymity masking and a disparate-impact gate run on every push, with Fisher's exact behind the alarm.\",\n          stack: [\"T-SQL\", \"lifelines\", \"Power BI\"], tests: \"52 tests\"\n        },\n        {\n          url: \"https://github.com/KushPatel29/supply-chain-analytics-dbt\",\n          img: \"https://kushpatel29.github.io/assets/dbt-lineage.jpg\",\n          imgStyle: { display: \"block\", width: \"100%\", height: \"168px\", backgroundImage: \"url(https://kushpatel29.github.io/assets/dbt-lineage.jpg)\", backgroundSize: \"cover\", backgroundPosition: \"top left\", borderBottom: \"1px solid var(--line-soft)\" },\n          alt: \"dbt lineage graph for the supply chain analytics project\",\n          kicker: \"TRANSFORMATION · SEMANTIC LAYER\",\n          title: \"Supply Chain Analytics — dbt\",\n          body: \"The answer to \\\"why does Finance's revenue number differ from Ops'?\\\" is usually that there are two definitions. This is one definition, versioned: dbt Core from staging to marts on dual DuckDB/Snowflake profiles, incremental models, SCD2 snapshots, a MetricFlow semantic layer, and an Airflow DAG that CI actually runs.\",\n          tags: [\"supply\"],\n          stats: [{ v: \"2\", k: \"WAREHOUSE PROFILES\" }, { v: \"SCD2\", k: \"SNAPSHOT HISTORY\" }, { v: \"53\", k: \"DBT TESTS\" }],\n          proof: \"One definition per metric in MetricFlow, and the Airflow DAG is executed in CI rather than described.\",\n          stack: [\"dbt\", \"MetricFlow\", \"Airflow\"], tests: \"53 dbt tests\"\n        },\n        {\n          url: \"https://github.com/KushPatel29/gl-reconciliation-dashboard-\",\n          img: \"https://kushpatel29.github.io/assets/gl-recon.jpg\",\n          imgStyle: { display: \"block\", width: \"100%\", height: \"168px\", backgroundImage: \"url(https://kushpatel29.github.io/assets/gl-recon.jpg)\", backgroundSize: \"cover\", backgroundPosition: \"top left\", borderBottom: \"1px solid var(--line-soft)\" },\n          alt: \"GL reconciliation close scorecard dashboard\",\n          kicker: \"FINANCE-GRADE · CONTROLS\",\n          title: \"GL / P&L Reconciliation\",\n          body: \"Month-end used to mean hunting a variance by hand. This engine finds four classes of discrepancy between ERP and subledger and proves every dollar traces back to source. Then, unmodified, I pointed it at a FOCUS-format cloud bill for FinOps chargeback — because a reconciliation is a reconciliation.\",\n          tags: [\"finance\"],\n          stats: [{ v: \"4\", k: \"DISCREPANCY CLASSES\" }, { v: \"100%\", k: \"VARIANCE TRACED\" }, { v: \"22\", k: \"CI TESTS\" }],\n          proof: \"The same engine, unmodified, reconciles a FOCUS-format cloud bill — the logic is portable, not bespoke.\",\n          stack: [\"T-SQL\", \"SQLite\", \"Power BI\"], tests: \"22 tests\"\n        },\n        {\n          url: \"https://github.com/KushPatel29/legacy-to-fabric-migration\",\n          img: \"https://kushpatel29.github.io/assets/migration.jpg\",\n          imgStyle: { display: \"block\", width: \"100%\", height: \"168px\", backgroundImage: \"url(https://kushpatel29.github.io/assets/migration.jpg)\", backgroundSize: \"cover\", backgroundPosition: \"top left\", borderBottom: \"1px solid var(--line-soft)\" },\n          alt: \"Migration command center dashboard\",\n          kicker: \"MIGRATION · CUTOVER GATE\",\n          title: \"Legacy-to-Fabric Migration\",\n          body: \"Nobody signs off on a migration because the new pipeline looks nicer. So old and new run side by side, row for row, and a GO/NO-GO gate makes the call. The negative tests are the real deliverable: I break the data on purpose to prove the validator catches dropped rows, offsetting errors, and phantom keys.\",\n          tags: [\"supply\"],\n          stats: [{ v: \"107\", k: \"ARTIFACTS VALIDATED\" }, { v: \"GO/NO-GO\", k: \"CUTOVER GATE\" }, { v: \"11\", k: \"CI TESTS\" }],\n          proof: \"Negative tests break the data on purpose to prove the validator catches what a cutover can't afford to miss.\",\n          stack: [\"SSIS\", \"SSRS\", \"PySpark\"], tests: \"11 tests\"\n        }\n    ];\n  }\n\n  lossData() {\n    return [\n        { stat: \"84.9% > 80.0%\", title: \"The ranker lost\", body: \"Two-stage retrieval with a gradient-boosted ranker, beaten by plain collaborative filtering on a customer-disjoint holdout. Simplicity shipped, and a test now guards the result.\" },\n        { stat: \"18.5% < 19.6%\", title: \"The forecaster lost\", body: \"A gradient-boosted multi-step forecaster lost to a moving average on WAPE. The moving average ships; the challenger's defeat is written into the README rather than quietly deleted.\" },\n        { stat: \"p ≈ 0.23\", title: \"The alarm that didn't cry wolf\", body: \"A fairness screen fired on the attrition model. Fisher's exact test showed small-sample noise rather than real bias — so I kept it as a monitored gate instead of pretending the alarm never happened.\" }\n    ];\n  }\n\n  domainData() {\n    return [\n        { n: \"01\", name: \"Sales Operations\", ask: \"Why did we miss the number this month?\", answer: \"Pipeline-to-invoice reporting with governed quota, attainment and mix logic, so the variance conversation starts from an agreed baseline instead of three competing extracts.\" },\n        { n: \"02\", name: \"Sales Rep Performance\", ask: \"Who's actually performing, adjusted for territory?\", answer: \"Rep scorecards normalised for territory potential and account mix — attainment, coverage, win rate and margin per rep, with the definitions locked so nobody can re-cut them mid-quarter.\" },\n        { n: \"03\", name: \"Customer Analytics\", ask: \"Which customers are quietly leaving?\", answer: \"Cohort retention, RFM segmentation, order-frequency decay and margin-by-customer — plus the recommender that proves a simple model can beat a clever one.\" },\n        { n: \"04\", name: \"Product & Assortment\", ask: \"Which SKUs earn their shelf space?\", answer: \"SKU-level velocity, contribution margin, cannibalisation and long-tail analysis; assortment views that separate products that sell from products that merely move.\" },\n        { n: \"05\", name: \"Vendor Performance\", ask: \"Which suppliers are costing us more than they invoice?\", answer: \"Vendor scorecards on fill rate, lead-time variance, price adherence and quality claims — landed-cost impact quantified rather than argued.\" },\n        { n: \"06\", name: \"Supply Chain Planning\", ask: \"How much should we be holding, and where?\", answer: \"Demand forecasting, inventory turns, days-on-hand and safety-stock coverage across a perishable network — plus the medallion pipeline and control tower that make the whole chain observable in one place.\" },\n        { n: \"07\", name: \"WMS & Inventory\", ask: \"Does the system match the shelf?\", answer: \"Cycle-count accuracy, bin utilisation, pick/pack throughput, FEFO and expiry-risk for perishables, and lot traceability that can answer a recall question in minutes.\" },\n        { n: \"08\", name: \"Logistics & Fulfilment\", ask: \"Where is OTIF really breaking?\", answer: \"OTIF decomposed by lane, carrier and failure reason, with freight cost per case, dock-to-stock timing and the difference between a late truck and a late promise.\" },\n        { n: \"09\", name: \"AP & AR\", ask: \"What do we owe, and what will we actually collect?\", answer: \"Aging, DPO/DSO, invoice-match exceptions and credit exposure — and on the AR side, an NRV model that prices open receivables at what they'll realistically bank.\" },\n        { n: \"10\", name: \"GL / P&L Reconciliation\", ask: \"Why doesn't the subledger tie to the GL?\", answer: \"Automated ERP-vs-subledger controls that classify discrepancies, trace every dollar of variance to source, and make month-end an audit instead of a hunt.\" },\n        { n: \"11\", name: \"Data Engineering & BI Platform\", ask: \"Can we trust the pipeline this all sits on?\", answer: \"Bronze→Silver→Gold pipelines in Fabric/ADF/Synapse and dbt, star-schema models, semantic layers, RLS/OLS, and CI that breaks the build when the data drifts.\" },\n        { n: \"12\", name: \"AI & Machine Learning\", ask: \"Is there a model here, or just a metric?\", answer: \"Forecasting, churn and flight-risk classification, recommenders, survival analysis and grounded LLM/text-to-SQL work — held to honest holdouts, fairness gates and a baseline it has to beat before it ships.\" }\n    ];\n  }\n\n  roleData() {\n    return [\n        {\n          period: \"MOST RECENT\",\n          org: \"Two Rivers Specialty Meats\",\n          title: \"Data Analyst — Operations, Logistics & Enterprise Reporting\",\n          scope: \"SALES OPS · WMS · LOGISTICS · VENDOR · PRODUCT · AP/AR · GL/P&L · PLATFORM\",\n          summary: \"The only analyst across a perishable-goods supply chain, so \\\"my domain\\\" meant whatever number the business needed to defend that week — from a rep's attainment to a lot recall to the month-end close.\",\n          stack: [\"Power BI\", \"DAX\", \"T-SQL\", \"PySpark\", \"Microsoft Fabric\", \"ADF\", \"Synapse\", \"SSIS/SSRS\", \"Python\"],\n          groups: [\n            {\n              label: \"SALES OPS & REP PERFORMANCE\",\n              points: [\n                \"Built the sales operations reporting layer — pipeline to invoice — with governed quota, attainment and product-mix logic, so monthly variance reviews argued about causes instead of whose extract was right.\",\n                \"Rep and territory scorecards normalised for account mix and territory potential: attainment, coverage, win rate and margin per rep, with definitions locked in the model so they couldn't be re-cut mid-quarter.\"\n              ]\n            },\n            {\n              label: \"CUSTOMER, PRODUCT & VENDOR\",\n              points: [\n                \"Customer analytics for a churn-sensitive book of trade accounts: cohort retention, order-frequency decay, RFM segmentation and margin by customer, which surfaced quiet attrition long before the rep noticed.\",\n                \"SKU and assortment analysis on velocity, contribution margin and cannibalisation — the input to real decisions about which products kept their slot.\",\n                \"Vendor scorecards on fill rate, lead-time variance, price adherence and quality claims, translated into landed-cost impact so procurement negotiated with numbers instead of impressions.\"\n              ]\n            },\n            {\n              label: \"WMS, INVENTORY & LOGISTICS\",\n              points: [\n                \"WMS reporting for warehouse operations: cycle-count accuracy, bin utilisation and pick/pack throughput, reconciling what the system claimed against what was on the shelf.\",\n                \"FEFO and expiry-risk analytics plus lot traceability for perishable inventory — designed so a recall question could be answered in minutes, not a day of spreadsheets.\",\n                \"Decomposed OTIF by lane, carrier and failure reason alongside freight cost per case and dock-to-stock timing, separating late trucks from over-promised delivery dates.\"\n              ]\n            },\n            {\n              label: \"FINANCE — GL/P&L, AP & AR\",\n              points: [\n                \"Sat with Sales, Finance and Supply Chain until we agreed on single definitions for P&L/GL and operations KPIs — OTIF, inventory turns, days on hand — then built the Power BI star schemas and DAX that made those definitions the only ones available.\",\n                \"AP and AR reporting on aging, DPO/DSO, invoice-match exceptions and credit exposure, giving Finance a working view of cash instead of a month-old snapshot.\",\n                \"Automated the reconciliation controls we used to run by hand: recurring discrepancies down ~45%, reporting errors down ~30%.\"\n              ]\n            },\n            {\n              label: \"DATA ENGINEERING & GOVERNANCE\",\n              points: [\n                \"Built Bronze→Silver→Gold pipelines in Fabric / ADF / Synapse with SQL and PySpark while keeping the legacy SSIS/SSRS estate alive — the migration repo is that experience, minus the 6am pages.\",\n                \"Owned the semantic layer: star-schema models, incremental refresh, and DAX measures reviewed like code rather than accumulated like sediment.\",\n                \"Implemented RLS/RBAC and column masking so cost, margin and people data only reached the people entitled to it, and documented it well enough to survive an audit.\"\n              ]\n            }\n          ]\n        },\n        {\n          period: \"EARLIER\",\n          org: \"Shivam Investments\",\n          title: \"Financial Analyst — Data & Reporting\",\n          scope: \"GL/P&L · AP/AR · RECONCILIATION · AUTOMATION\",\n          summary: \"Where the reconciliation habit started: close cycles tight enough that a manual mistake showed up as a real number in front of real people.\",\n          stack: [\"SQL\", \"Python\", \"Power BI\", \"Excel\"],\n          groups: [\n            {\n              label: \"CLOSE & CONTROLS\",\n              points: [\n                \"Reconciled GL/P&L across sources every month and chased variances to source — the discipline the reconciliation repo later turned into a tested engine.\",\n                \"Worked AP and AR aging and exception reporting, tightening the follow-up loop on the accounts that were actually at risk.\"\n              ]\n            },\n            {\n              label: \"AUTOMATION\",\n              points: [\n                \"Replaced recurring manual analysis with Python + SQL feeding Power BI, cutting the effort around ~40% and freeing the month for questions worth asking.\",\n                \"Standardised the recurring reporting pack so each cycle started from the previous one's logic instead of a fresh workbook.\"\n              ]\n            }\n          ]\n        }\n    ];\n  }\n\n  coursework() {\n    return [\"Machine Learning\", \"Deep Learning\", \"NLP / LLMs\", \"Time-Series Forecasting\", \"Statistical Inference\", \"Data Mining\", \"Cloud Data Platforms\"];\n  }\n\n  certs() {\n    return [\n        { name: \"Microsoft Certified: Fabric Analytics Engineer\", code: \"DP-600\", status: \"IN PROGRESS\", body: \"Lakehouse and semantic-model work in Fabric, which is the platform most of my recent pipelines and control-tower reporting run on.\" }\n    ];\n  }\n\n  pipelineSteps() {\n    return [\n        { step: \"STEP 01\", title: \"Agree the grain\", body: \"Before a single measure, the business and I settle what one row means. Most reporting disputes are definition disputes wearing a costume.\" },\n        { step: \"STEP 02\", title: \"Contract the source\", body: \"Schema contracts at the boundary, so upstream drift fails loudly at ingestion instead of silently in a Gold table.\" },\n        { step: \"STEP 03\", title: \"Model it once\", body: \"Star schema, one semantic layer, measures reviewed like code — so there's exactly one place a KPI can be wrong, and one place to fix it.\" },\n        { step: \"STEP 04\", title: \"Test the claim\", body: \"Every headline number gets a test: control totals, ceilings, negative cases. If a claim stops being true, CI goes red.\" },\n        { step: \"STEP 05\", title: \"Ship it auditable\", body: \"The number arrives with its lineage, its SQL and its access rules attached, so anyone can check my work without asking me.\" }\n    ];\n  }\n\n  principles() {\n    return [\n        { title: \"Beat the baseline or don't ship\", body: \"Every model is measured against the dumbest thing that could work. If the moving average wins, the moving average ships.\" },\n        { title: \"Governance before dashboards\", body: \"RLS, masking and k-anonymity go in before the first visual, because retrofitting access control is how sensitive data leaks into a screenshot.\" },\n        { title: \"Prove the failure path\", body: \"It isn't enough that the happy path works. I break the data on purpose in CI and prove the guard catches it.\" }\n    ];\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
