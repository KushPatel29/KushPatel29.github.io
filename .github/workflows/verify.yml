# The site claims every number on it is verifiable. The links should be
# held to the same standard: this fails the build if any internal href or
# asset path on the page doesn't return 200.
name: verify

on:
  # Weekly as well as on push: the external links point at other people's
  # servers, and a demo that has gone to sleep or moved should be found here
  # rather than by someone following the link from a CV.
  schedule:
    - cron: "17 7 * * 1"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Internal links and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-freshness needs real history to find the last content commit.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: HEAD every internal href and asset path
        run: node tools/check-links.mjs

      - name: The footer's "last updated" date must be true
        run: node tools/check-freshness.mjs

      - name: Footer, structured data and sitemap dates must agree
        run: node tools/check-sitemap.mjs

      - name: The no-JS repo count must match the project cards
        run: node tools/check-repo-count.mjs

      - name: Test totals must reconcile across cards, hero, and metadata
        run: node tools/check-test-counts.mjs

      # Role fit is a worksheet of claims. Every row names its source, the
      # chip says the same as the tick, the "Tied out" totals equal the rows
      # above them, and each reading list lands on a card on this page.
      - name: Role fit rows, sources and totals must reconcile
        run: node tools/check-role-fit.mjs

      - name: Project and live-demo counts must match the manifest
        run: node tools/check-headline-counts.mjs

      # The only check here that reads something this repo does not control.
      # The flagship card quotes nineteen figures off the deployed demo; it
      # once quoted a local run's instead, and no check on either side could
      # see it. Skips loudly (exit 0) if the demo is unreachable, fails if a
      # figure drifted or a pattern stopped matching.
      - name: Figures on the flagship card must still be on the live demo
        run: node tools/check-live-figures.mjs

      # The footer makes a privacy claim in one part of the file and the
      # script that could falsify it sits in another. This ties them: no
      # analytics configured -> "NO TRACKER" is allowed; analytics live ->
      # the footer must say "NO COOKIES". Cookie-setting and session-
      # recording vendors are refused outright.
      - name: The footer's privacy claim must match what the page loads
        run: node tools/check-analytics.mjs

      # Five CTAs on this page hand over a PDF. It had drifted into saying the
      # Two Rivers role was current while the experience section said it ended,
      # and into naming a different city than the byline. Nothing could see it:
      # every other gate reads index.html, and the PDF had no source to read.
      - name: The résumé must not contradict the page that links it
        run: node tools/check-resume.mjs

      # The job-fit skill tells a hiring decision what Kush can prove. Its
      # fallback evidence ledger is a copy of the manifest and résumé, and a
      # copy drifts; this holds it to the originals.
      - name: The role-fit skill must cite the current evidence
        run: node tools/check-role-fit-skill.mjs

      # A screenshot swap once left healthcare-spc declaring a height 17px
      # taller than the file, and three "PNGs" here are JPEGs. Neither is
      # visible on the page; both are visible to a reader as a jump on load
      # or a wrong content type.
      - name: Images must be the size and format the page claims
        run: node tools/check-images.mjs

      - name: Workflow dependencies must be immutable
        run: node tools/check-actions-pinned.mjs

  quality:
    name: Browser, accessibility and performance quality
    needs: links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Enable the repository-pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install quality-gate dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the tested browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Exercise recruiter flows, accessibility and visual contracts
        run: pnpm test:e2e

      - name: Enforce Lighthouse budgets
        run: pnpm test:lighthouse

      - name: Preserve diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-quality-reports
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  portfolio-intelligence:
    name: Portfolio Intelligence dbt contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/portfolio-intelligence-platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install the pinned free-tier adapter
        run: pip install dbt-duckdb==1.9.2

      - name: Build all 20 nodes, including 15 data tests
        run: dbt build --project-dir dbt --profiles-dir dbt

      - name: Export the dashboard fixture from tested relations
        run: python scripts/export_dashboard.py

      - name: Generated dashboard data must be committed and current
        run: git diff --exit-code -- dist/data/dashboard.json

      - name: Check browser instrumentation and dashboard JavaScript
        run: node --check dist/app.js && node --check analytics/tracking.js && node --check analytics/web-vitals.js && node scripts/check_public_contract.mjs

  demos:
    name: External links and live demos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Every external link and live demo answers
        run: node tools/check-live-demos.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # check-test-counts proves the badges on this page agree with each other.
      # They can agree perfectly and all be wrong: the healthcare card, its
      # repository's badge and the profile README all said 182 while the suite
      # collected 345. This compares each card to the badge in the repository
      # it links to, which is itself pinned to what pytest collects.
      - name: Every card must match the repository it links to
        run: node tools/check-repo-badges.mjs
