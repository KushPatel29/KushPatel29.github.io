name: Analytics CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install dbt-duckdb==1.9.2
      - name: Parse project
        run: dbt parse --project-dir dbt --profiles-dir dbt
      - name: Build deterministic demo pipeline
        run: dbt seed --project-dir dbt --profiles-dir dbt && dbt build --project-dir dbt --profiles-dir dbt
      - name: Check dashboard JavaScript
        run: node --check dist/app.js && node --check analytics/tracking.js && node --check analytics/web-vitals.js
